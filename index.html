<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeu du Snake Personnalisable</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #222;
        color: #fff;
        margin: 0;
        padding: 20px;
      }
      h1 {
        margin-bottom: 10px;
      }
      #setup {
        margin-bottom: 20px;
        background-color: #333;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      label {
        margin: 0 10px;
      }
      input[type="number"] {
        width: 60px;
        padding: 5px;
        border-radius: 4px;
        border: none;
        text-align: center;
      }
      button {
        padding: 6px 15px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background-color: #45a049;
      }
      #score-board {
        font-size: 1.2rem;
        margin-bottom: 10px;
        font-weight: bold;
      }
      #game-container {
        position: relative;
      }
      canvas {
        border: 4px solid #fff;
        background-color: #111;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      }
      #controls-info {
        margin-top: 15px;
        color: #aaa;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Le Jeu du Snake</h1>

    <div id="setup">
      <label for="gridWidth">Largeur (cases) :</label>
      <input type="number" id="gridWidth" value="20" min="10" max="50" />

      <label for="gridHeight">Hauteur (cases) :</label>
      <input type="number" id="gridHeight" value="20" min="10" max="50" />

      <button onclick="startGame()">Lancer la partie</button>
    </div>

    <div id="score-board">Score : <span id="score">0</span></div>

    <div id="game-container">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div id="controls-info">
      Utilisez les flèches directionnelles (↑, ↓, ←, →) pour diriger le serpent.
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const scoreElement = document.getElementById("score");

      const GRID_CELL_SIZE = 20; // Taille d'une case en pixels
      let gameInterval;

      let snake = [];
      let food = { x: 0, y: 0 };
      let dx = GRID_CELL_SIZE;
      let dy = 0;
      let score = 0;
      let changingDirection = false;
      let gridCols = 20;
      let gridRows = 20;

      // Écoute les touches du clavier
      document.addEventListener("keydown", changeDirection);

      function startGame() {
        // Récupérer et appliquer la taille de la grille choisie
        gridCols = parseInt(document.getElementById("gridWidth").value) || 20;
        gridRows = parseInt(document.getElementById("gridHeight").value) || 20;

        // Ajuster la taille du canvas
        canvas.width = gridCols * GRID_CELL_SIZE;
        canvas.height = gridRows * GRID_CELL_SIZE;

        // Réinitialiser les variables du jeu
        clearInterval(gameInterval);
        score = 0;
        scoreElement.textContent = score;
        dx = GRID_CELL_SIZE;
        dy = 0;
        changingDirection = false;

        // Position initiale du serpent au milieu
        const startX = Math.floor(gridCols / 2) * GRID_CELL_SIZE;
        const startY = Math.floor(gridRows / 2) * GRID_CELL_SIZE;
        snake = [
          { x: startX, y: startY },
          { x: startX - GRID_CELL_SIZE, y: startY },
          { x: startX - GRID_CELL_SIZE * 2, y: startY },
        ];

        createFood();

        // Lancer la boucle de jeu (vitesse : 100ms par frame)
        gameInterval = setInterval(mainLoop, 100);
      }

      function mainLoop() {
        if (hasGameEnded()) {
          clearInterval(gameInterval);
          alert(
            "Game Over ! Votre score final est de : " +
              score +
              ". Vous pouvez modifier la grille et rejouer.",
          );
          return;
        }

        changingDirection = false;
        clearCanvas();
        drawFood();
        moveSnake();
        drawSnake();
      }

      function clearCanvas() {
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function drawSnake() {
        snake.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? "#4CAF50" : "#81C784"; // Tête plus foncée
          ctx.strokeStyle = "#111";
          ctx.fillRect(part.x, part.y, GRID_CELL_SIZE, GRID_CELL_SIZE);
          ctx.strokeRect(part.x, part.y, GRID_CELL_SIZE, GRID_CELL_SIZE);
        });
      }

      function moveSnake() {
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
        if (hasEatenFood) {
          score += 10;
          scoreElement.textContent = score;
          createFood();
        } else {
          snake.pop();
        }
      }

      function changeDirection(event) {
        const keyPressed = event.keyCode;
        const LEFT_KEY = 37;
        const UP_KEY = 38;
        const RIGHT_KEY = 39;
        const DOWN_KEY = 40;

        if (changingDirection) return;

        const goingUp = dy === -GRID_CELL_SIZE;
        const goingDown = dy === GRID_CELL_SIZE;
        const goingRight = dx === GRID_CELL_SIZE;
        const goingLeft = dx === -GRID_CELL_SIZE;

        if (keyPressed === LEFT_KEY && !goingRight) {
          dx = -GRID_CELL_SIZE;
          dy = 0;
          changingDirection = true;
        }
        if (keyPressed === UP_KEY && !goingDown) {
          dx = 0;
          dy = -GRID_CELL_SIZE;
          changingDirection = true;
        }
        if (keyPressed === RIGHT_KEY && !goingLeft) {
          dx = GRID_CELL_SIZE;
          dy = 0;
          changingDirection = true;
        }
        if (keyPressed === DOWN_KEY && !goingUp) {
          dx = 0;
          dy = GRID_CELL_SIZE;
          changingDirection = true;
        }
      }

      function randomPosition(max) {
        return Math.floor(Math.random() * max) * GRID_CELL_SIZE;
      }

      function createFood() {
        food.x = randomPosition(gridCols);
        food.y = randomPosition(gridRows);

        // Vérifier si la nourriture n'apparaît pas sur le serpent
        snake.forEach((part) => {
          const hasEaten = part.x === food.x && part.y === food.y;
          if (hasEaten) createFood();
        });
      }

      function drawFood() {
        ctx.fillStyle = "#FF5252";
        ctx.fillRect(food.x, food.y, GRID_CELL_SIZE, GRID_CELL_SIZE);
      }

      function hasGameEnded() {
        // Collision avec les murs
        const hitLeftWall = snake[0].x < 0;
        const hitRightWall = snake[0].x >= canvas.width;
        const hitToptWall = snake[0].y < 0;
        const hitBottomWall = snake[0].y >= canvas.height;

        if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall)
          return true;

        // Collision avec soi-même
        for (let i = 4; i < snake.length; i++) {
          if (snake[i].x === snake[0].x && snake[i].y === snake[0].y)
            return true;
        }
        return false;
      }
    </script>
  </body>
</html>
